[project]
name = "saferoute"
version = "0.1.0"
description = "SafeRoute 3D — NYC trafik kazası verisi için veri hattı ve analiz arka ucu"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",
    "requests>=2.32",
    "matplotlib>=3.9",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
# scikit-learn testlerde Haversine sütun sırası ve ağırlıklı DBSCAN eşdeğerliğini doğrulamak için;
# modelleme bağımlılığı olarak Faz 3'te ana bağımlılıklara taşınacak.
dev = ["pytest>=8", "scikit-learn>=1.5"]
notebook = ["ipykernel>=6.29", "nbclient>=0.10", "nbformat>=5.10"]

[project.scripts]
saferoute = "saferoute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saferoute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
